# FOR TESTING PURPOSES ONLY! NOT SUITABLE FOR PRODUCTION USAGE!
#
# Deploys fineract-provider.war into a stock Tomcat, which is the deployment path described under
# "How to build the WAR file" in the README. Everything else in CI exercises the Spring Boot jar via
# the jib image, so this file exists to keep the WAR from rotting unnoticed; see
# .github/workflows/build-war-smoke.yml.
#
# Run ./gradlew :fineract-war:war first — the WAR is bind-mounted, not built into an image.
#
# Tomcat serves plain HTTP on 8080 rather than HTTPS on 8443. Configuring the TLS connector would
# mean shipping a server.xml purely for this job, and the suites take the protocol and port from
# BASE_URL / BACKEND_* anyway.
services:
  db:
    extends:
      file: ./config/docker/compose/postgresql.yml
      service: postgresql

  fineract-war:
    # Same Tomcat major as the servlet API the WAR is built against, on the JDK the project targets.
    image: tomcat:10.1-jdk25-temurin
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${PWD}/fineract-war/build/libs/fineract-provider.war:/usr/local/tomcat/webapps/fineract-provider.war:ro
    tmpfs:
      - /tmp:rw,nosuid,size=256m
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./config/docker/env/fineract.env
      - ./config/docker/env/fineract-common.env
      - ./config/docker/env/fineract-postgresql.env
    environment:
      # Spring Boot's embedded-container settings do not apply to a WAR in an external Tomcat; the
      # connector in Tomcat's own server.xml decides, and that is plain HTTP on 8080.
      FINERACT_SERVER_SSL_ENABLED: "false"
# FOR TESTING PURPOSES ONLY! NOT SUITABLE FOR PRODUCTION USAGE!
