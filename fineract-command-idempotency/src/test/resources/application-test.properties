fineract.command.enabled=true
fineract.command.hook-servlet-headers-enabled=true
fineract.command.hook-timestamp-enabled=true
fineract.command.hook-username-enabled=true

fineract.command.jdbc.enabled=true
fineract.command.jdbc.file-dead-letter-queue-enabled=false
fineract.command.jdbc.file-dead-letter-queue-path=./build/fineract/dlq

fineract.command.audit.enabled=true
fineract.command.audit.hook-pre-enabled=true
fineract.command.audit.hook-post-enabled=true
fineract.command.audit.hook-error-enabled=true

fineract.command.idempotency.enabled=true
fineract.command.idempotency.key-header-name=Idempotency-Key
fineract.command.idempotency.hook-key-header-pre=true
fineract.command.idempotency.hook-check-pre=true

spring.liquibase.enabled=true
spring.liquibase.drop-first=true
spring.liquibase.default-schema=public
spring.liquibase.change-log=classpath:/db/changelog/tenant/module/command/module-changelog-master.xml

# the sample API renders errors through a MessageSource, same as the real application does
spring.messages.basename=org/apache/fineract/messages
