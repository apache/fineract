dependencies {
    implementation(
            project(path: ':fineract-command'),
            // a claimed command is moved out of UNDER_PROCESSING, and its result stored, by the audit hooks; this
            // module cannot replay anything without them, and says so at startup
            project(path: ':fineract-command-audit'),
            )

    implementation(
            'org.springframework.boot:spring-boot-starter',
            // the key arrives on an HTTP header and the original response is replayed over HTTP, so this module
            // owns a servlet filter and a JAX-RS exception mapper
            'org.springframework.boot:spring-boot-starter-webmvc',
            'jakarta.ws.rs:jakarta.ws.rs-api',

            'org.apache.commons:commons-lang3',
            )
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation(
            project(path: ':fineract-command-test'),
            project(path: ':fineract-command-jdbc'),
            )
    testImplementation (
            'org.springframework.boot:spring-boot-starter-data-jdbc',
            // Spring Boot 4 ships the Liquibase auto-configuration separately; the schema under test comes from it
            'org.springframework.boot:spring-boot-liquibase',
            'org.liquibase:liquibase-core',
            'org.testcontainers:junit-jupiter',
            'org.testcontainers:postgresql',
            )
    testImplementation ('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'com.jayway.jsonpath', module: 'json-path'
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
        exclude group: 'jakarta.activation'
        exclude group: 'javax.activation'
        exclude group: 'org.skyscreamer'
    }
}
