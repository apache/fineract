plugins {
    id 'se.thinkcode.cucumber-runner' version '0.0.14'
    id 'io.qameta.allure' version '4.1.0'
}

apply plugin: 'java'
apply plugin: 'eclipse'

repositories {
    mavenCentral()
}

def e2eTestsCoreTestOutput = project(':fineract-e2e-tests-core')
        .extensions.getByType(SourceSetContainer).named('test').get().output

dependencies {
    testImplementation(project(':fineract-avro-schemas'))
    testImplementation(project(':fineract-client-feign'))
    testImplementation(e2eTestsCoreTestOutput)

    testImplementation 'org.springframework:spring-context'
    implementation 'org.springframework:spring-test'
    testImplementation 'org.springframework:spring-jms'

    testImplementation 'com.squareup.retrofit2:retrofit'
    testImplementation 'org.apache.httpcomponents:httpclient'
    testImplementation 'org.apache.commons:commons-lang3'
    testImplementation 'com.google.guava:guava'
    testImplementation ('com.googlecode.json-simple:json-simple:1.1.1') {
        exclude group: 'junit', module: 'junit'
    }
    testImplementation 'com.google.code.gson:gson'

    testImplementation 'org.junit.platform:junit-platform-suite'
    testImplementation 'org.junit.platform:junit-platform-console'
    testImplementation 'io.cucumber:cucumber-java'
    testImplementation 'io.cucumber:cucumber-junit'
    testImplementation 'io.cucumber:cucumber-spring'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine'

    testImplementation 'io.qameta.allure:allure-cucumber7-jvm'

    testImplementation 'org.assertj:assertj-core'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'ch.qos.logback:logback-core'
    testImplementation 'ch.qos.logback:logback-classic'

    testImplementation 'org.apache.activemq:activemq-client'
    testImplementation 'org.apache.avro:avro'
    testImplementation 'org.awaitility:awaitility'
    testImplementation 'io.github.classgraph:classgraph'

    testImplementation 'org.apache.commons:commons-collections4'

    testImplementation 'org.springframework:spring-jdbc'
    testImplementation 'org.postgresql:postgresql'
    testImplementation 'org.mariadb.jdbc:mariadb-java-client'
}

allure {
    // Pins the Allure 2 commandline for allureReport/allureServe. This must stay set: with no
    // version the plugin defaults to Allure 3, which pulls a Node.js toolchain instead.
    // 2.42.1 is the plugin's own Allure 2 default. The io.qameta.allure:* adapters are a separate
    // release stream (no shared version number exists) and are left unpinned so the plugin keeps
    // the whole adapter family on one version.
    version = '2.42.1'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty("cucumber.junit-platform.naming-strategy", "long")
}

tasks.named('cucumber') {
    dependsOn 'spotlessCheck'
    finalizedBy 'allureReport'
}

cucumber {
    // Use -Pcucumber.features=... if passed, otherwise default
    if (project.hasProperty("cucumber.features")) {
        featurePath = project.getProperty("cucumber.features")
    } else {
        featurePath = "src/test/resources/features";
    }

    tags = 'not @Skip'
    if (project.hasProperty("cucumber.tags")) {
        tags = [project.getProperty("cucumber.tags")]
    }

    if (project.hasProperty("cucumber.name")) {
        name = project.getProperty("cucumber.name")
    }

    plugin = ['pretty', 'io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm']
}
