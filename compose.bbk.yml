# Local BBK proof-of-concept overrides for the upstream development stack.
# This remains a development configuration and is not suitable for production.
services:
  db:
    image: postgres:18.3
    ports: !override
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 stores version-specific data below this directory.
      - bbk-postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_ROOT_PASSWORD:?Set POSTGRES_ROOT_PASSWORD in .env}"
      FINERACT_DB_PASS: "${FINERACT_DB_PASSWORD:?Set FINERACT_DB_PASSWORD in .env}"

  fineract:
    image: fineract:1.15.0
    ports: !override
      - "127.0.0.1:8443:8443"
    environment:
      FINERACT_HIKARI_PASSWORD: "${FINERACT_DB_PASSWORD:?Set FINERACT_DB_PASSWORD in .env}"
      FINERACT_DEFAULT_TENANTDB_PWD: "${FINERACT_DB_PASSWORD:?Set FINERACT_DB_PASSWORD in .env}"
      FINERACT_DEFAULT_MASTER_PASSWORD: "${FINERACT_MASTER_PASSWORD:?Set FINERACT_MASTER_PASSWORD in .env}"

volumes:
  bbk-postgres-data:
    name: bbk-fineract-postgres-18
