# --------------------------------------------
# Collection Sheet Validation Messages
# --------------------------------------------

# Office ID
collection.sheet.officeId.positiveOrZero=Office ID must be a positive number.
collection.sheet.officeId.digits=Office ID must be a valid number with up to {integer} digits.

# Date Format
collection.sheet.dateFormat.invalid=The provided date format is invalid. Use a format like 'dd MMMM yyyy'.

# Locale
collection.sheet.locale.notBlank=Locale is required and cannot be blank.
collection.sheet.locale.size=Locale size must be between {min} and {max} characters.

# --------------------------------------------
# Repayment Transactions - Loan
# --------------------------------------------

collection.sheet.repayment.transactions.loanId.positiveOrZero=Loan ID must be a positive number.
collection.sheet.repayment.transactions.loanId.digits=Loan ID must be a valid number with up to {integer} digits.

# Repayment Transactions - Amount
collection.sheet.repayment.transactions.transaction.amount.min=Repayment amount must be at least 0.01.

# Repayment Transactions - Payment Type
collection.sheet.repayment.transactions.payment.type.id.positiveOrZero=Payment Type ID must be a positive number.
collection.sheet.repayment.transactions.payment.type.id.digits=Payment Type ID must be a valid number with up to {integer} digits.

# --------------------------------------------
# Savings Due Transactions - Savings
# --------------------------------------------

collection.sheet.savings.due.transactions.savings.id.positiveOrZero=Savings ID must be a positive number.
collection.sheet.saving.due.transactions.savings.id.digits=Savings ID must be a valid number with up to {integer} digits.

# Savings Due Transactions - Amount
collection.sheet.savings.due.transaction.amount.required=Transaction amount is required for savings due transaction.
collection.sheet.savings.due.transactions.amount.min=Transaction amount for savings must be at least 0.01.

# Savings Due Transactions - Deposit Account Type
collection.sheet.savings.due.transactions.deposit.account.type.positiveOrZero=Deposit Account Type must be a positive number.
collection.sheet.savings.due.transactions.deposit.account.type.digits=Deposit Account Type must be a valid number with up to {integer} digits.

# Savings Due Transactions - Payment Type
collection.sheet.savings.due.transactions.deposit.payment.type.id.positiveOrZero=Payment Type ID must be a positive number.
collection.sheet.savings.due.transactions.deposit.payment.type.id.digits=Payment Type ID must be \
  a valid number with up to {integer} digits.

collection.sheet.actual.disbursement.date.local.date=Invalid Actual disbursement Local Date.
collection.sheet.transaction.date.local.date=Invalid Transaction Local Date.

collection.sheet.actual.disbursement.date.format=Invalid Actual disbursement date range, max date\
  \ is {maxYearsAgo} years.
collection.sheet.transaction.date.format=Invalid transaction date range, max date\
  \ is {maxYearsAgo} years.
