[build]
builder = "nixpacks"
buildCommand = "./gradlew :fineract-provider:build -x test -x cucumber -x spotlessCheck -x rat --no-daemon && cp fineract-provider/build/libs/fineract-provider-*-SNAPSHOT.jar /app/fineract-provider.jar"
startCommand = "./railway-start.sh"

[deploy]
healthcheckPath = "/fineract-provider/actuator/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
