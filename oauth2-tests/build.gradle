description = 'Fineract Integration Tests for OAuth2'

// The suites in this module run against an already-running Fineract instance that has OAuth2 authentication enabled.
// The build does not start one; bring it up with docker-compose-oauth2-test.yml (see
// fineract-doc/src/docs/en/chapters/testing/integration.adoc) before running the tests.
apply from: 'dependencies.gradle'

dependencies {
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.43.0'
    testImplementation 'io.github.bonigarcia:webdrivermanager:6.3.4'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.4'
}

// NOTE: Gradle suggested these dependencies
compileTestJava.dependsOn(':fineract-provider:generateGitProperties', ':fineract-provider:processResources', ':fineract-provider:resolve')
spotbugsTest.dependsOn(':fineract-provider:generateGitProperties', ':fineract-provider:processResources', ':fineract-provider:resolve')
