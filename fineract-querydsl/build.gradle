description = 'Fineract QueryDSL'

apply plugin: 'java'
apply plugin: 'java-library'
apply plugin: 'eclipse'
apply plugin: 'org.apache.fineract.querydsl.codegen'

apply from: 'dependencies.gradle'

querydslCodegen {
    packageName = 'org.apache.fineract.query'

    resourceRoots.setFrom([
            'fineract-provider',
            'fineract-loan',
            'fineract-investor',
            'fineract-savings',
            'fineract-progressive-loan',
            'fineract-command-jdbc',
            'fineract-working-capital-loan',
            'fineract-loan-origination',
            'fineract-querydsl',
    ].collect { file("$rootDir/$it/src/main/resources") })

    changelogFile = 'db/changelog/querydsl-changelog-master.xml'
    changelogIncludes = ['db/changelog/querydsl-changelog-master.xml', 'db/changelog/tenant/**']
    contextRuns = ['postgresql']
    changelogParameters = ['fineract.tenant.rounding-mode': '6']
}

tasks.withType(JavaCompile).configureEach {
    options.errorprone.excludedPaths = '.*/build/generated/sources/querydsl/.*'
}