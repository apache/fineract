description = 'Fineract Integration Tests'

// The suites in this module run against an already-running Fineract instance. The build does not
// start one; see fineract-doc/src/docs/en/chapters/testing/integration.adoc for the supported ways
// to bring one up, and use the waitForFineract task below to block until it answers.
apply from: 'dependencies.gradle'

dependencies {
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.14.4'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.14.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-suite:1.14.4'
}

import java.net.HttpURLConnection
import java.net.URL
import javax.net.ssl.HttpsURLConnection
import javax.net.ssl.SSLContext
import javax.net.ssl.TrustManager
import javax.net.ssl.X509TrustManager

// Blocks until the Fineract instance the tests will talk to answers its health endpoint. The build
// never starts that instance, so this is only useful after you have brought one up yourself; it
// reads the same BACKEND_* environment variables as ConfigProperties.Backend so it always polls the
// address the tests will actually use.
tasks.register('waitForFineract') {
    description = 'Waits until the Fineract instance under test answers /actuator/health'
    group = 'verification'

    def timeoutSeconds = (project.findProperty('waitForFineractTimeoutSeconds') ?: '600') as int
    def healthUrl = "${System.getenv('BACKEND_PROTOCOL') ?: 'https'}://${System.getenv('BACKEND_HOST') ?: 'localhost'}:${System.getenv('BACKEND_PORT') ?: '8443'}/fineract-provider/actuator/health".toString()

    doLast {
        int waited = 0
        int interval = 5

        TrustManager[] trustAllCerts = [
            new X509TrustManager() {
                java.security.cert.X509Certificate[] getAcceptedIssuers() { return null }
                void checkClientTrusted(java.security.cert.X509Certificate[] certs, String authType) {}
                void checkServerTrusted(java.security.cert.X509Certificate[] certs, String authType) {}
            }
        ] as TrustManager[]

        SSLContext sc = SSLContext.getInstance("SSL")
        sc.init(null, trustAllCerts, new java.security.SecureRandom())
        HttpsURLConnection.setDefaultSSLSocketFactory(sc.getSocketFactory())
        HttpsURLConnection.setDefaultHostnameVerifier({ hostname, session -> true })

        URL url = new URL(healthUrl)
        println "Waiting for Fineract at ${healthUrl} (timeout: ${timeoutSeconds}s)..."

        while (waited < timeoutSeconds) {
            try {
                HttpURLConnection connection = (HttpURLConnection) url.openConnection()
                connection.setConnectTimeout(2000)
                connection.setReadTimeout(2000)
                connection.setRequestMethod("GET")
                int responseCode = connection.getResponseCode()
                if (responseCode == 200) {
                    println "Fineract is up!"
                    return
                }
            } catch (Exception ignored) { }
            sleep(interval * 1000)
            waited += interval
            println "Still waiting..."
        }

        throw new GradleException("Fineract at ${healthUrl} did not become healthy within ${timeoutSeconds} seconds")
    }
}

// Configure proper test output directories
sourceSets {
    test {
        output.resourcesDir = layout.buildDirectory.dir('resources/test').get().asFile
        java.destinationDirectory = layout.buildDirectory.dir('classes/java/test').get().asFile
    }
}

tasks.named('compileTestJava') {
    outputs.cacheIf { true }
}

// NOTE: Gradle suggested these dependencies
compileTestJava.dependsOn(':fineract-provider:generateGitProperties', ':fineract-provider:processResources', ':fineract-provider:resolve')
spotbugsTest.dependsOn(':fineract-provider:generateGitProperties', ':fineract-provider:processResources', ':fineract-provider:resolve')
