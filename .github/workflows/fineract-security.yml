# ============================================================================
# P2.4 — Security Scan · AMPLIADO v4
# SoW 4.0 §4.3 | Proyecto 2 — Fineract Pruebas y Calidad (Dev)
#
# Disparador: cada PR contra main + nightly full-scan (GitHub Flow)
# Bloqueante: sí — bloquea PR si CVSS ≥9.0 (L.1 §6.2)
#
# Cobertura SoW v4:
#   SAST + SCA + Secrets + IaC → Aikido PR Checks App (nativa, automática)
#   S-04: DAST (OWASP ZAP) → este workflow (nightly)
#   S-05: Firma Cosign de imagen → este workflow
#   S-06: S-BOM SPDX/CycloneDX → este workflow
#   L.1 §6.2: Trivy container scan → este workflow
# ============================================================================
name: "P2.4 · Fineract Security Scan"

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'      # Nightly full-scan 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write
  packages: write

concurrency:
  group: p2-4-security-${{ github.head_ref || github.ref_name || 'nightly' }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  IMAGE_NAME: quida/fineract
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ══════════════════════════════════════════════════════════════════
  # Job 1: Container build + Trivy scan + Cosign + SBOM
  # SoW refs: S-05 (Cosign), S-06 (SBOM), L.1 §6.2 (container scan)
  #
  # SAST/SCA/Secrets/IaC → Aikido PR Checks App (nativa, automática)
  # ══════════════════════════════════════════════════════════════════
  container-security:
    name: "Container Scan + Cosign + S-BOM"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Gradle build (JAR)
        run: ./gradlew bootJar --no-daemon -x test

      - name: Docker build
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -f fineract-provider/Dockerfile \
            .

      # ── Trivy container scan (L.1 §6.2) ──
      - name: Trivy container scan (SARIF)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}'
          format: 'sarif'
          output: 'trivy-container.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Trivy container scan (tabla para logs)
        if: always()
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}'
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'

      # ── S-BOM: Syft genera SPDX + CycloneDX (S-06) ──
      - name: Instalar Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generar S-BOM SPDX
        run: |
          syft ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -o spdx-json=sbom-spdx.json

      - name: Generar S-BOM CycloneDX
        run: |
          syft ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -o cyclonedx-json=sbom-cyclonedx.json

      # ── Firma Cosign keyless (S-05) ──
      - name: Instalar Cosign
        uses: sigstore/cosign-installer@v3

      - name: Firmar imagen con Cosign (keyless)
        if: github.event_name != 'pull_request'
        run: |
          cosign sign --yes \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        env:
          COSIGN_EXPERIMENTAL: 1

      # ── Publicar artifacts ──
      - name: Upload S-BOM + Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-artifacts-p2-4
          path: |
            sbom-spdx.json
            sbom-cyclonedx.json
            trivy-container.sarif
          retention-days: 90

  # ══════════════════════════════════════════════════════════════════
  # Job 2: DAST — OWASP ZAP (S-04)
  # Solo en nightly o manual (no en PR — demasiado lento)
  # ══════════════════════════════════════════════════════════════════
  dast-zap:
    name: "DAST · OWASP ZAP"
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fineract_tenants
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Build y levantar Fineract para DAST
        run: |
          ./gradlew bootJar --no-daemon -x test
          java -jar fineract-provider/build/libs/fineract-provider-*.jar \
            --spring.profiles.active=test \
            --server.port=8443 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8443/fineract-provider/actuator/health > /dev/null 2>&1 && break
            sleep 5
          done

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.13.0
        with:
          target: 'https://localhost:8443/fineract-provider/'
          rules_file_name: '.github/zap-rules.tsv'
          cmd_options: '-a -j'
          allow_issue_writing: false

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-report-p2-4
          path: report_html.html
          retention-days: 90

      - name: Cleanup
        if: always()
        run: pkill -f "fineract-provider" || true

  # ══════════════════════════════════════════════════════════════════
  # Job 3: Security Gate — resultado consolidado
  # ══════════════════════════════════════════════════════════════════
  security-gate:
    name: "Security Gate (P2.4)"
    if: always() && github.event_name == 'pull_request'
    needs: [container-security]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluar resultados
        run: |
          echo "Container scan: ${{ needs.container-security.result }}"
          echo ""
          echo "NOTA: SAST/SCA/Secrets/IaC están cubiertos por Aikido PR Checks App"
          echo "      (check nativo separado, visible en el PR como status check)"
          echo ""
          if [[ "${{ needs.container-security.result }}" == "failure" ]]; then
            echo "::error::Security gate FAILED — container scan tiene CRITICAL/HIGH (L.1 §6.2)"
            exit 1
          fi
          echo "✅ Security gate PASSED (container scan)"
