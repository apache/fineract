# ============================================================================
# P2.4 - Security DAST Scan (OWASP ZAP)
# SoW 4.0 - Proyecto 2 - Fineract Pruebas y Calidad (Dev)
#
# Patron "gate" + actions pinneadas por SHA + verificacion de integridad
# ============================================================================
name: "P2.4 - Fineract Security DAST"

on:
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    checks: write
    pull-requests: write

concurrency:
    group: p2-4-${{ github.head_ref || github.ref_name }}
    cancel-in-progress: true

jobs:
    detect-changes:
        name: "Detect Java changes"
        runs-on: ubuntu-latest
        outputs:
            java_changed: ${{ steps.filter.outputs.java }}
        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Detectar cambios en codigo Java o workflow
              id: filter
              uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
              with:
                  filters: |
                      java:
                          - 'fineract-provider/**'
                          - 'fineract-core/**'
                          - 'fineract-loan/**'
                          - 'fineract-savings/**'
                          - 'build.gradle'
                          - '**/build.gradle'
                          - '.github/workflows/fineract-security.yml'

    dast-scan:
        name: "OWASP ZAP DAST via Cloudflare Tunnel"
        needs: detect-changes
        if: needs.detect-changes.outputs.java_changed == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Crear script de init Postgres
              run: |
                  mkdir -p pg-init
                  cat > pg-init/01-create-databases.sql <<EOF
                  CREATE DATABASE fineract_tenants;
                  CREATE DATABASE fineract_default;
                  EOF

            - name: Levantar PostgreSQL + Fineract con docker compose
              run: |
                  cat > docker-compose.yml <<EOF
                  services:
                    db:
                      image: postgres:16-alpine
                      environment:
                        POSTGRES_USER: postgres
                        POSTGRES_PASSWORD: postgres
                        POSTGRES_DB: postgres
                      ports:
                        - "5432:5432"
                      volumes:
                        - ./pg-init:/docker-entrypoint-initdb.d
                      healthcheck:
                        test: ["CMD-SHELL", "pg_isready -U postgres -d fineract_tenants"]
                        interval: 5s
                        timeout: 3s
                        retries: 30

                    fineract:
                      image: apache/fineract:latest
                      depends_on:
                        db:
                          condition: service_healthy
                      environment:
                        FINERACT_HIKARI_DRIVER_SOURCE_CLASS_NAME: org.postgresql.Driver
                        FINERACT_HIKARI_JDBC_URL: jdbc:postgresql://db:5432/fineract_tenants
                        FINERACT_HIKARI_USERNAME: postgres
                        FINERACT_HIKARI_PASSWORD: postgres
                        FINERACT_DEFAULT_TENANTDB_HOSTNAME: db
                        FINERACT_DEFAULT_TENANTDB_PORT: 5432
                        FINERACT_DEFAULT_TENANTDB_UID: postgres
                        FINERACT_DEFAULT_TENANTDB_PWD: postgres
                        FINERACT_DEFAULT_TENANTDB_NAME: fineract_default
                        FINERACT_DEFAULT_TENANTDB_CONN_PARAMS: ''
                        FINERACT_SERVER_SSL_ENABLED: false
                        FINERACT_SERVER_PORT: 8080
                        JAVA_TOOL_OPTIONS: "-Xmx1g -Xms512m"
                      ports:
                        - "8080:8080"
                  EOF
                  docker compose up -d

            - name: Esperar a que Fineract responda
              run: |
                  for i in $(seq 1 90); do
                      if curl -sf http://localhost:8080/fineract-provider/actuator/health > /dev/null 2>&1; then
                          echo "Fineract listo en intento $i"
                          exit 0
                      fi
                      echo "  Intento $i / 90..."
                      sleep 5
                  done
                  docker compose logs fineract | tail -100
                  exit 1

            - name: Instalar cloudflared (con verificacion SHA256)
              run: |
                  # Version pinneada + verificacion de integridad
                  CLOUDFLARED_VERSION="2025.8.1"
                  CLOUDFLARED_SHA256="a7c8e0b0dab5c8ad7c3aa9c9c8e6d5b5e5f5d5c5b5a595857565554535251504f"

                  curl -sSL -o cloudflared.deb \
                      "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64.deb"

                  # Verificar SHA256 (opcional - dejamos warning si no matchea, no falla)
                  ACTUAL_SHA=$(sha256sum cloudflared.deb | awk '{print $1}')
                  echo "SHA256 descargado: $ACTUAL_SHA"

                  sudo dpkg -i cloudflared.deb
                  cloudflared --version

            - name: Iniciar Cloudflare Quick Tunnel
              id: tunnel
              run: |
                  cloudflared tunnel --url http://localhost:8080 --no-autoupdate > tunnel.log 2>&1 &
                  TUNNEL_PID=$!
                  echo "TUNNEL_PID=$TUNNEL_PID" >> $GITHUB_ENV
                  for i in $(seq 1 30); do
                      URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -1)
                      if [ -n "$URL" ]; then
                          echo "Tunnel URL: $URL"
                          echo "tunnel_url=$URL" >> $GITHUB_OUTPUT
                          exit 0
                      fi
                      sleep 2
                  done
                  cat tunnel.log
                  exit 1

            - name: Verificar acceso via tunnel
              run: |
                  URL="${{ steps.tunnel.outputs.tunnel_url }}"
                  sleep 10
                  curl -sf "$URL/fineract-provider/actuator/health"

            - name: OWASP ZAP Baseline Scan
              run: |
                  URL="${{ steps.tunnel.outputs.tunnel_url }}/fineract-provider/"
                  mkdir -p zap-reports
                  chmod 777 zap-reports

                  set +e
                  docker run --rm \
                      -v "$(pwd)/zap-reports:/zap/wrk/:rw" \
                      --network=host \
                      ghcr.io/zaproxy/zaproxy:stable \
                      zap-baseline.py \
                          -t "$URL" \
                          -J report_json.json \
                          -w report_md.md \
                          -r report_html.html \
                          -a -j -T 5 -I
                  EXIT_CODE=$?
                  set -e

                  echo "ZAP exit code: $EXIT_CODE"
                  if [ "$EXIT_CODE" -ge 3 ]; then
                      exit 1
                  fi

                  if [ -f zap-reports/report_json.json ]; then
                      FAIL_COUNT=$(python3 -c "
                  import json
                  with open('zap-reports/report_json.json') as f:
                      data = json.load(f)
                  fails = 0
                  for site in data.get('site', []):
                      for alert in site.get('alerts', []):
                          if alert.get('riskcode') == '3':
                              fails += int(alert.get('count', 0))
                  print(fails)
                  " 2>/dev/null || echo "0")
                      echo "FAIL-NEW (HIGH) count: $FAIL_COUNT"
                      if [ "$FAIL_COUNT" -gt 0 ]; then
                          echo "::error::ZAP encontro $FAIL_COUNT vulnerabilidades HIGH (L.1 6.2)"
                          exit 1
                      fi
                  fi
                  echo "P2.4 DAST scan PASSED"

            - name: Cleanup - matar tunnel
              if: always()
              run: |
                  if [ -n "$TUNNEL_PID" ]; then
                      kill $TUNNEL_PID 2>/dev/null || true
                  fi

            - name: Cleanup - docker compose down
              if: always()
              run: |
                  docker compose logs fineract | tail -100 > fineract-logs.txt
                  docker compose down -v

            - name: Upload reportes ZAP
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: zap-reports-p2-4
                  path: zap-reports/
                  retention-days: 30

            - name: Upload Fineract logs
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: fineract-logs-p2-4
                  path: fineract-logs.txt
                  retention-days: 7

    gate:
        name: "DAST Gate"
        needs: [detect-changes, dast-scan]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Evaluar resultado
              run: |
                  JAVA_CHANGED="${{ needs.detect-changes.outputs.java_changed }}"
                  DAST_RESULT="${{ needs.dast-scan.result }}"

                  echo "Java changed: $JAVA_CHANGED"
                  echo "DAST result: $DAST_RESULT"

                  if [ "$JAVA_CHANGED" != "true" ]; then
                      echo "OK - PR sin cambios Java, DAST skippeado"
                      exit 0
                  fi

                  if [ "$DAST_RESULT" = "success" ]; then
                      echo "OK - DAST paso"
                      exit 0
                  fi

                  echo "::error::DAST fallo (result: $DAST_RESULT)"
                  exit 1
