# ============================================================================
# P2.1 - Unit Tests (JUnit)
# SoW 4.0 - Proyecto 2 - Fineract Pruebas y Calidad (Dev)
# ============================================================================
name: "P2.1 - Fineract Unit Tests"

on:
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    checks: write

concurrency:
    group: p2-1-${{ github.head_ref || github.ref_name }}
    cancel-in-progress: true

jobs:
    detect-changes:
        name: "Detect Java changes"
        runs-on: ubuntu-latest
        outputs:
            java_changed: ${{ steps.filter.outputs.java }}
        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Detectar cambios en codigo Java
              id: filter
              uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
              with:
                  filters: |
                      java:
                          - 'fineract-provider/**/*.java'
                          - 'fineract-provider/**/*.gradle'
                          - 'fineract-core/**/*.java'
                          - 'fineract-core/**/*.gradle'
                          - 'fineract-loan/**/*.java'
                          - 'fineract-loan/**/*.gradle'
                          - 'fineract-savings/**/*.java'
                          - 'fineract-savings/**/*.gradle'
                          - 'fineract-investor/**/*.java'
                          - 'fineract-investor/**/*.gradle'
                          - 'fineract-branch/**/*.java'
                          - 'fineract-branch/**/*.gradle'
                          - 'fineract-accounting/**/*.java'
                          - 'fineract-accounting/**/*.gradle'
                          - 'fineract-command-test/**/*.java'
                          - 'fineract-command-test/**/*.gradle'
                          - 'build.gradle'
                          - 'settings.gradle'

    unit-tests:
        name: "Unit Tests"
        needs: detect-changes
        if: needs.detect-changes.outputs.java_changed == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  fetch-depth: 0

            - name: Fetch tags
              run: git fetch --tags --force

            - name: Setup JDK
              uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
              with:
                  distribution: 'temurin'
                  java-version: '25'
                  cache: 'gradle'

            - name: Gradle test (solo fineract-provider, sin generadores de SDK)
              run: |
                  export GRADLE_OPTS="-Xmx6g -Dorg.gradle.jvmargs=-Xmx6g"
                  # Ejecutamos solo el test del provider (que trae 1337 tests)
                  # y evitamos los tasks de SDK generation que se quedan sin heap
                  ./gradlew :fineract-provider:test --no-daemon --continue --max-workers=2

            - name: Publicar reporte JUnit
              if: always()
              uses: dorny/test-reporter@6e6a65b7a0bd2c9197df7d0ae36ac5cee784230c # v2.0.0
              with:
                  name: JUnit Results (P2.1)
                  path: 'fineract-provider/build/test-results/test/TEST-*.xml'
                  reporter: java-junit
                  fail-on-error: true

            - name: Upload test artifacts
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: test-reports-p2-1
                  path: |
                      fineract-provider/build/test-results/
                      fineract-provider/build/reports/tests/
                  retention-days: 30

    gate:
        name: "Unit Tests Gate"
        needs: [detect-changes, unit-tests]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Evaluar resultado
              run: |
                  JAVA_CHANGED="${{ needs.detect-changes.outputs.java_changed }}"
                  TESTS_RESULT="${{ needs.unit-tests.result }}"
                  echo "Java changed: $JAVA_CHANGED"
                  echo "Tests result: $TESTS_RESULT"
                  if [ "$JAVA_CHANGED" != "true" ]; then
                      echo "OK - PR sin cambios Java, tests skippeados"
                      exit 0
                  fi
                  if [ "$TESTS_RESULT" = "success" ]; then
                      echo "OK - Unit tests pasaron"
                      exit 0
                  fi
                  echo "::error::Unit tests fallaron (result: $TESTS_RESULT)"
                  exit 1
