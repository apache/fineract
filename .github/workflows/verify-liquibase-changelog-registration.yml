name: Verify Liquibase Changelog Registration

on:
  pull_request:
    paths:
      - '**/db/changelog/**'
      - 'scripts/check-liquibase-changelog-registration.sh'
      - '.github/workflows/verify-liquibase-changelog-registration.yml'

permissions:
  contents: read

jobs:
  verify-changelog-registration:
    name: Verify Liquibase Changelog Registration
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags --depth=1 origin "$BASE_REF"

      - name: Check changelog registration
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/check-liquibase-changelog-registration.sh --base-ref "origin/$BASE_REF"
