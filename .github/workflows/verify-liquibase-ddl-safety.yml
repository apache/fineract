name: Verify Liquibase DDL Safety

on:
  workflow_call:
    secrets:
      DEVELOCITY_ACCESS_KEY:
        required: false

permissions:
  contents: read

jobs:
  ddl-safety-check:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch origin "$BASE_REF" --no-tags

      - name: Detect Liquibase changes
        id: changes
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          MERGE_BASE=$(git merge-base "origin/$BASE_REF" HEAD)
          CHANGES=$(git diff --name-only "$MERGE_BASE"..HEAD -- '**/db/changelog/**/*.xml' || true)
          if [ -n "$CHANGES" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "$CHANGES"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No Liquibase changes detected."
          fi

      - name: Check for override label
        if: steps.changes.outputs.has_changes == 'true'
        id: override
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' 2>/dev/null || true)
          if echo "$LABELS" | grep -q "ddl-safety-override"; then
            echo "override=true" >> $GITHUB_OUTPUT
            echo "Override label found — check will report but not block."
          else
            echo "override=false" >> $GITHUB_OUTPUT
          fi

      - name: Run DDL safety check
        if: steps.changes.outputs.has_changes == 'true'
        id: ddl-check
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          REPORT_DIR: ${{ runner.temp }}/ddl-safety-report
        run: |
          chmod +x scripts/check-liquibase-ddl-safety.sh
          ./scripts/check-liquibase-ddl-safety.sh \
            --base-ref "origin/$BASE_REF" \
            --head-ref HEAD \
            --config config/liquibase \
            --output-dir "$REPORT_DIR"

      - name: Write step summary
        if: failure()
        env:
          HAS_CHANGES: ${{ steps.changes.outputs.has_changes }}
          REPORT_FILE: ${{ runner.temp }}/ddl-safety-report/report.md
        run: |
          if [ "$HAS_CHANGES" != "true" ]; then
            echo "## Liquibase DDL Safety Check - SKIPPED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No Liquibase changelog XML changes detected." >> $GITHUB_STEP_SUMMARY
          elif [ -f "$REPORT_FILE" ]; then
            cat "$REPORT_FILE" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Liquibase DDL Safety Check - PASSED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No dangerous DDL changes detected." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Archive report
        if: failure() && steps.changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ddl-safety-report
          path: ${{ runner.temp }}/ddl-safety-report/
          retention-days: 1
          compression-level: 9

      - name: Fail if critical violations found (unless overridden)
        if: steps.changes.outputs.has_changes == 'true' && steps.ddl-check.outcome == 'failure' && steps.override.outputs.override != 'true'
        run: |
          echo "::error::Dangerous DDL changes detected on critical tables. See the report above for details."
          echo "::error::Add the 'ddl-safety-override' label to bypass this check if the change is intentional."
          exit 1
