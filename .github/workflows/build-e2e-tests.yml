name: Fineract E2E Tests

on:
  workflow_call:
    inputs:
      image_artifact:
        required: true
        type: string
      image_name:
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      ACTIVEMQ_USER: admin
      ACTIVEMQ_PASSWORD: admin
      ACTIVEMQ_TOPIC_NAME: events

    steps:
      - name: Setup CI
        uses: ./.github/actions/setup-ci.yml
        with:
          fetch-depth: 0
          fetch-tags: true
          java-version: '21'
          distribution: 'zulu'
          cache-read-only: true

      - name: Download image artifact
        uses: actions/download-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
        with:
          name: "${{ inputs.image_artifact }}"

      - name: Load image
        run: |
          docker load -i fineract-image.tar
          docker images | head -n 20

      - name: Start PostgreSQL + ActiveMQ E2E stack
        run: docker compose -f docker-compose-postgresql-test-activemq.yml up -d

      - name: Wait for Manager health
        run: |
          set -e
          for i in $(seq 1 60); do
            if curl -fsSk https://localhost:8443/fineract-provider/actuator/health >/dev/null; then
              echo "Manager is healthy"
              exit 0
            fi
            echo "Waiting for Manager... ($i/60)"
            sleep 10
          done
          echo "Manager did not become healthy in time"
          docker ps -a
          docker logs $(docker ps -q --filter name=fineract) || true
          exit 1

      - name: Run E2E tests
        run: |
          ./gradlew --no-daemon --console=plain :fineract-e2e-tests-runner:cucumber

      - name: Archive logs & reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
        with:
          name: e2e-logs-and-reports
          path: |
            **/build/reports/tests/
            **/build/reports/
            **/logs/
            **/out/
          retention-days: 5
          if-no-files-found: ignore

      - name: Clean up
        if: always()
        run: |
          docker compose -f docker-compose-postgresql-test-activemq.yml down -v
          docker system prune -f
