# ============================================================================
# P3.2 — Deploy Fineract
# SoW 4.0 §4.4 | Proyecto 3 — Fineract Build y Despliegue (Dev+QA)
#
# Disparador: post-build exitoso (workflow_call) o manual
# Acciones: Cosign verify → ArgoCD sync → Liquibase → health check → rollback
#
# PoC: sin cluster EKS/ArgoCD real, los steps de deploy son simulados.
#      El workflow valida la estructura y el flujo de decisión.
# ============================================================================
name: "P3.2 · Fineract Deploy"

on:
  workflow_call:
    inputs:
      image_tag:
        description: 'Tag de la imagen a desplegar'
        required: true
        type: string
      environment:
        description: 'Ambiente destino (dev | qa)'
        required: true
        type: string
        default: 'dev'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag de la imagen a desplegar'
        required: true
      environment:
        description: 'Ambiente destino'
        required: true
        type: choice
        options:
          - dev
          - qa

permissions:
  contents: read
  id-token: write

concurrency:
  group: p3-2-deploy-${{ inputs.environment }}
  cancel-in-progress: false   # No cancelar deploys en curso

env:
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  EKS_CLUSTER: quida-eks-${{ inputs.environment }}
  NAMESPACE: fineract

jobs:
  deploy:
    name: "Deploy to ${{ inputs.environment }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # En producción: environment con reviewers requeridos (G.1 §7.2 CAB)
    # environment: ${{ inputs.environment }}

    steps:
      - name: Checkout (Helm charts)
        uses: actions/checkout@v4

      # ── Step 1: Verificación firma Cosign ──
      - name: Instalar Cosign
        uses: sigstore/cosign-installer@v3

      - name: Verificar firma de imagen (S-05)
        run: |
          IMAGE="${ECR_REGISTRY:-local}/quida/fineract:${{ inputs.image_tag }}"
          echo "Verificando firma Cosign de: $IMAGE"
          if [ -n "$ECR_REGISTRY" ]; then
            cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "github.com/${{ github.repository }}" \
              "$IMAGE"
            echo "✅ Firma verificada"
          else
            echo "::notice::PoC sin ECR — verificación de firma omitida"
          fi

      # ── Step 2: ArgoCD sync ──
      - name: ArgoCD sync del Helm chart
        run: |
          echo "::group::ArgoCD Sync"
          echo "Ambiente:  ${{ inputs.environment }}"
          echo "Namespace: ${{ env.NAMESPACE }}"
          echo "Image tag: ${{ inputs.image_tag }}"

          if [ -n "${{ secrets.ARGOCD_SERVER }}" ]; then
            # Producción: argocd CLI real
            # argocd app set fineract-${{ inputs.environment }} \
            #   --helm-set image.tag=${{ inputs.image_tag }} \
            #   --server ${{ secrets.ARGOCD_SERVER }} \
            #   --auth-token ${{ secrets.ARGOCD_TOKEN }}
            # argocd app sync fineract-${{ inputs.environment }} --wait
            echo "ArgoCD sync ejecutado"
          else
            echo "::notice::PoC sin ArgoCD — simulando sync"
            echo "  helm upgrade fineract-${{ inputs.environment }} ./k8s/helm/quida-app \\"
            echo "    --namespace ${{ env.NAMESPACE }} \\"
            echo "    --set image.tag=${{ inputs.image_tag }}"
          fi
          echo "::endgroup::"

      # ── Step 3: Migraciones Liquibase ──
      - name: Migraciones Liquibase
        run: |
          echo "::group::Liquibase Migrations"
          echo "En producción: Fineract ejecuta migraciones automáticamente al iniciar."
          echo "Si se usa Liquibase explícito:"
          echo "  liquibase --changeLogFile=changelog.xml update"
          echo "::notice::PoC — migraciones omitidas (no hay DB destino)"
          echo "::endgroup::"

      # ── Step 4: Health checks post-deploy ──
      - name: Health check post-deploy
        run: |
          echo "::group::Health Check"
          if [ -n "${{ secrets.ARGOCD_SERVER }}" ]; then
            # Producción: curl al endpoint real
            # FINERACT_URL="https://fineract-${{ inputs.environment }}.quida.internal/actuator/health"
            # for i in $(seq 1 12); do
            #   STATUS=$(curl -sf "$FINERACT_URL" | jq -r '.status' || echo "DOWN")
            #   echo "Attempt $i: $STATUS"
            #   [ "$STATUS" = "UP" ] && break
            #   sleep 10
            # done
            # [ "$STATUS" != "UP" ] && echo "::error::Health check failed" && exit 1
            echo "Health check: UP"
          else
            echo "::notice::PoC — health check simulado (no hay cluster)"
            echo "Endpoint esperado: /fineract-provider/actuator/health"
            echo "Status: UP (simulado)"
          fi
          echo "::endgroup::"

      # ── Step 5: Rollback automático si health checks fallan ──
      - name: Rollback si falló
        if: failure()
        run: |
          echo "::error::Deploy falló — ejecutando rollback"
          if [ -n "${{ secrets.ARGOCD_SERVER }}" ]; then
            # argocd app rollback fineract-${{ inputs.environment }}
            echo "ArgoCD rollback ejecutado"
          else
            echo "::notice::PoC — rollback simulado"
            echo "  argocd app rollback fineract-${{ inputs.environment }}"
          fi

      - name: Resumen del deploy
        if: success()
        run: |
          echo "## Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Ambiente | ${{ inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image tag | ${{ inputs.image_tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Namespace | ${{ env.NAMESPACE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
