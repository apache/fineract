name: Auto-Fix and Deploy

on:
  push:
    branches: [ develop, master, main ]
  pull_request:
    branches: [ develop, master, main ]
  schedule:
    # Run daily at 2 AM UTC for maintenance checks
    - cron: '0 2 * * *'

env:
  JAVA_VERSION: '21'
  GRADLE_VERSION: '8.1.3'
  NODE_VERSION: '20'

jobs:
  auto-fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fineract_tenants
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      dragonfly:
        image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Auto-fix configuration files
      run: |
        # Remove Docker/MariaDB references
        find . -name "*.properties" -o -name "*.yml" -o -name "*.yaml" | xargs grep -l "mysql\|mariadb\|docker" | while read file; do
          echo "Cleaning $file"
          sed -i 's/mysql/postgresql/gi' "$file"
          sed -i 's/mariadb/postgresql/gi' "$file"
          sed -i '/docker/d' "$file" || true
        done
        
        # Update database URLs to PostgreSQL
        find . -name "application*.properties" | xargs sed -i 's|jdbc:mysql|jdbc:postgresql|g'
        find . -name "application*.properties" | xargs sed -i 's|:3306|:5432|g'
        
        # Clean up deprecated configurations
        find . -name "application*.properties" | xargs sed -i '/deprecated/d'

    - name: Validate environment files
      run: |
        # Check for .env files and validate them
        if [ -f .env ]; then
          echo "Validating .env file"
          # Remove empty lines and comments for validation
          grep -v '^#' .env | grep -v '^$' | while IFS='=' read -r key value; do
            if [ -z "$value" ]; then
              echo "Warning: Empty value for $key"
            fi
          done
        fi

    - name: Build with Gradle
      run: ./gradlew build -x test --parallel --build-cache
      env:
        GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx2g"

    - name: Run tests
      run: ./gradlew test --parallel --continue
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/fineract_tenants
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: postgres
        SPRING_REDIS_HOST: localhost
        SPRING_REDIS_PORT: 6379

    - name: Run integration tests
      run: ./gradlew integrationTest --continue || true
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/fineract_tenants
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: postgres

    - name: Generate test reports
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Test Results
        path: '**/build/test-results/test/TEST-*.xml'
        reporter: java-junit

    - name: Check for security vulnerabilities
      run: ./gradlew dependencyCheckAnalyze || true

    - name: Code quality analysis
      run: |
        ./gradlew checkstyleMain checkstyleTest || true
        ./gradlew spotbugsMain spotbugsTest || true

    - name: Fix Railway health checks
      run: |
        # Ensure health check endpoints are properly configured
        find . -name "application*.properties" | xargs grep -l management.endpoints || {
          echo "Adding health check configuration"
          find . -name "application.properties" | head -1 | xargs -I {} sh -c 'echo "
# Health Check Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.defaults.enabled=true
management.health.db.enabled=true
management.health.redis.enabled=true
" >> {}'
        }

    - name: Optimize build files
      run: |
        # Remove unused dependencies and optimize build scripts
        find . -name "build.gradle" | xargs grep -l "mysql\|mariadb" | while read file; do
          echo "Updating $file"
          sed -i '/mysql/d' "$file"
          sed -i '/mariadb/d' "$file"
        done

    - name: Auto-commit fixes
      if: github.event_name != 'pull_request'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A
        if ! git diff --cached --quiet; then
          git commit -m "🤖 Auto-fix: Clean up configurations and optimize build

          - Removed Docker/MariaDB references
          - Updated to PostgreSQL configurations  
          - Fixed Railway health checks
          - Optimized build files
          - Validated environment configurations
          
          Auto-generated by: ${{ github.workflow }} #${{ github.run_number }}"
          git push
        else
          echo "No changes to commit"
        fi

  deploy:
    needs: auto-fix-and-validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Deploy to Railway
      if: github.ref == 'refs/heads/develop'
      run: |
        echo "Deploying to Railway staging environment"
        # Railway deployment will be triggered automatically by Railway's GitHub integration
        
    - name: Deploy to Production
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      run: |
        echo "Deploying to Railway production environment"
        # Production deployment logic here

  maintenance:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Daily maintenance tasks
      run: |
        echo "Running daily maintenance checks..."
        # Check for outdated dependencies
        # Validate configurations
        # Clean up temporary files
        # Update documentation if needed
