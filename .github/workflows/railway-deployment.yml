name: Railway Deployment Workflow

on:
  push:
    branches: [main, develop, 'feature/*', 'fix/*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  GRADLE_VERSION: '8.1.3'

jobs:
  validate:
    name: 🔍 Validate Environment
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.check-deploy.outputs.deploy }}
      branch-name: ${{ steps.extract-branch.outputs.branch }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'gradle'

      - name: Extract branch name
        id: extract-branch
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "branch=${{ github.head_ref }}" >> $GITHUB_OUTPUT
          else
            echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
          fi

      - name: Check if should deploy
        id: check-deploy
        run: |
          if [[ "${{ github.event_name }}" == "push" && ("${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/develop" || "${{ github.ref }}" =~ ^refs/heads/feature/ || "${{ github.ref }}" =~ ^refs/heads/fix/) ]]; then
            echo "deploy=true" >> $GITHUB_OUTPUT
          else
            echo "deploy=false" >> $GITHUB_OUTPUT
          fi

  lint:
    name: 🧹 Code Linting
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'gradle'

      - name: Run Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Run SpotBugs
        run: ./gradlew spotbugsMain spotbugsTest

      - name: Run Spotless check
        run: ./gradlew spotlessCheck

  test:
    name: 🧪 Unit Tests & Code Coverage
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'gradle'

      - name: Run tests with JaCoCo
        run: ./gradlew test jacocoTestReport

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          fail_ci_if_error: false

      - name: Verify minimum code coverage
        run: |
          COVERAGE=$(grep -o 'Total.*[0-9]\{1,3\}\.[0-9]\{1,2\}%' build/reports/jacoco/test/html/index.html | grep -o '[0-9]\{1,3\}\.[0-9]\{1,2\}')
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "❌ Code coverage is below 80%: $COVERAGE%"
            exit 1
          else
            echo "✅ Code coverage is acceptable: $COVERAGE%"
          fi

  build:
    name: 🏗️ Build Application
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'gradle'

      - name: Build with Gradle
        run: ./gradlew :fineract-provider:build -x test -x cucumber -x spotlessCheck -x rat --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: fineract-artifacts
          path: |
            fineract-provider/build/libs/*.jar
            config/railway/**

  deploy:
    name: 🚀 Deploy to Railway
    runs-on: ubuntu-latest
    needs: [validate, build]
    if: needs.validate.outputs.should-deploy == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: fineract-artifacts

      - name: Install Railway CLI
        run: curl -fsSL https://railway.app/install.sh | sh

      - name: Login to Railway
        run: railway login --browserless
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}      - name: Deploy to Railway
        run: |
          echo "Deploying to Railway..."
          railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          
      - name: Verify Deployment
        run: |
          echo "Verifying deployment..."
          ATTEMPTS=0
          MAX_ATTEMPTS=20
          
          until $(curl --output /dev/null --silent --head --fail $(railway service url --url)/fineract-provider/actuator/health) || [ $ATTEMPTS -eq $MAX_ATTEMPTS ]; do
            ATTEMPTS=$((ATTEMPTS+1))
            echo "Waiting for deployment to be ready... ($ATTEMPTS/$MAX_ATTEMPTS)"
            sleep 15
          done
          
          if [ $ATTEMPTS -eq $MAX_ATTEMPTS ]; then
            echo "❌ Deployment verification timed out"
            exit 1
          else
            echo "✅ Deployment verified successfully"
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}  notify:
    name: 📢 Deployment Notification
    runs-on: ubuntu-latest
    needs: [validate, deploy]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        if: needs.deploy.result == 'success'

      - name: Install Railway CLI
        if: needs.deploy.result == 'success'
        run: curl -fsSL https://railway.app/install.sh | sh

      - name: Login to Railway
        if: needs.deploy.result == 'success'
        run: railway login --browserless
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Get Deployment Details
        if: needs.deploy.result == 'success'
        id: deployment-details
        run: |
          DEPLOY_URL=$(railway service url --url)
          BRANCH_NAME="${{ needs.validate.outputs.branch-name }}"
          DEPLOY_ID=$(railway service show --json | jq -r '.id')
          DEPLOY_ENV=$(railway environment show --json | jq -r '.name')
          PROJECT_NAME=$(railway project show --json | jq -r '.name')
          
          # Determine deployment type based on branch name
          DEPLOY_TYPE="preview"
          if [[ "$BRANCH_NAME" == "main" ]]; then
            DEPLOY_TYPE="production"
          elif [[ "$BRANCH_NAME" == "develop" ]]; then
            DEPLOY_TYPE="staging"
          elif [[ "$BRANCH_NAME" =~ ^feature/ ]]; then
            DEPLOY_TYPE="feature"
          elif [[ "$BRANCH_NAME" =~ ^fix/ ]]; then
            DEPLOY_TYPE="hotfix"
          fi
          
          echo "deploy-url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "branch-name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "deploy-id=$DEPLOY_ID" >> $GITHUB_OUTPUT
          echo "deploy-env=$DEPLOY_ENV" >> $GITHUB_OUTPUT
          echo "project-name=$PROJECT_NAME" >> $GITHUB_OUTPUT
          echo "deploy-type=$DEPLOY_TYPE" >> $GITHUB_OUTPUT
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Create Deployment Summary
        if: needs.deploy.result == 'success'
        run: |
          cat << EOF > deployment-summary.md
          ## 🚀 Deployment Summary
          
          | Detail | Value |
          | ------ | ----- |
          | **Status** | ✅ Success |
          | **Environment** | ${{ steps.deployment-details.outputs.deploy-env }} |
          | **Branch** | ${{ steps.deployment-details.outputs.branch-name }} |
          | **Project** | ${{ steps.deployment-details.outputs.project-name }} |
          | **Deployment URL** | ${{ steps.deployment-details.outputs.deploy-url }} |
          | **Health Check** | ${{ steps.deployment-details.outputs.deploy-url }}/fineract-provider/actuator/health |
          | **API Docs** | ${{ steps.deployment-details.outputs.deploy-url }}/fineract-provider/swagger-ui/index.html |
          | **Railway Service ID** | ${{ steps.deployment-details.outputs.deploy-id }} |
          | **Deployment Time** | $(date) |
          
          ### Quick Links
          
          - 🩺 [Health Check](${{ steps.deployment-details.outputs.deploy-url }}/fineract-provider/actuator/health)
          - 📊 [Metrics](${{ steps.deployment-details.outputs.deploy-url }}/fineract-provider/actuator/metrics)
          - 📝 [API Docs](${{ steps.deployment-details.outputs.deploy-url }}/fineract-provider/swagger-ui/index.html)
          - 🔄 [Railway Dashboard](https://railway.app/project/${{ steps.deployment-details.outputs.deploy-id }})
          
          EOF
          
          cat deployment-summary.md      - name: Deployment Failure
        if: needs.deploy.result != 'success'
        run: |
          cat << EOF > deployment-failure.md
          ## ❌ Deployment Failure
          
          | Detail | Value |
          | ------ | ----- |
          | **Status** | ❌ Failed |
          | **Branch** | ${{ needs.validate.outputs.branch-name }} |
          | **Failure Time** | $(date) |
          
          ### Troubleshooting
          
          1. Check the deployment logs for error details
          2. Verify Railway token is valid
          3. Check if there are any issues with the Railway platform
          4. Review the build logs for any compilation errors
          
          EOF
          
          cat deployment-failure.md
      
      - name: Create GitHub Job Summary
        if: needs.deploy.result == 'success'
        run: cat deployment-summary.md >> $GITHUB_STEP_SUMMARY

      - name: Create GitHub Failure Summary
        if: needs.deploy.result != 'success'
        run: cat deployment-failure.md >> $GITHUB_STEP_SUMMARY
        
      - name: Send Deployment Notification
        if: always()
        run: |
          if [[ "${{ needs.deploy.result }}" == "success" ]]; then
            echo "✅ Deployment was successful"
            echo "🌐 Application URL: ${{ steps.deployment-details.outputs.deploy-url || 'Not available' }}"
            echo "📊 Health check: ${{ steps.deployment-details.outputs.deploy-url || 'Not available' }}/fineract-provider/actuator/health"
            echo "📝 API docs: ${{ steps.deployment-details.outputs.deploy-url || 'Not available' }}/fineract-provider/swagger-ui/index.html"
          else
            echo "❌ Deployment failed"
            echo "Check the logs for more information"
          fi
          
