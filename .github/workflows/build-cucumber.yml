name: Fineract Build & Cucumber tests (without E2E tests)

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-core:
    name: build-core
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup CI
        uses: ./.github/actions/setup-ci
        with:
          fetch-depth: 0
          fetch-tags: true
          java-version: '21'
          distribution: 'zulu'
          cache-read-only: false

      - name: Build (no tests)
        run: |
          ./gradlew --no-daemon --console=plain build -x test -x cucumber -x doc

      - name: Archive build reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
        with:
          name: test-results-build-core
          path: |
            **/build/reports/
          retention-days: 5
          if-no-files-found: ignore

  cucumber:
    name: cucumber
    needs: build-core
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup CI
        uses: ./.github/actions/setup-ci
        with:
          fetch-depth: 0
          fetch-tags: true
          java-version: '21'
          distribution: 'zulu'
          cache-read-only: false

      - name: Run cucumber
        run: |
          ./gradlew --no-daemon --console=plain cucumber -x :fineract-e2e-tests-runner:cucumber

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
        with:
          name: test-results-cucumber
          path: |
            **/build/reports/
          retention-days: 5
          if-no-files-found: ignore

      - name: Archive server logs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
        with:
          name: server-logs-cucumber
          path: '**/build/cargo/'
          retention-days: 5
          if-no-files-found: ignore

  build-progressive-loan:
    name: build-progressive-loan
    needs: build-core
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup CI
        uses: ./.github/actions/setup-ci
        with:
          fetch-depth: 0
          fetch-tags: true
          java-version: '21'
          distribution: 'zulu'
          cache-read-only: false

      - name: Build and Test Progressive Loan
        run: |
          # Build the JAR
          ./gradlew --no-daemon --console=plain :fineract-progressive-loan-embeddable-schedule-generator:shadowJar

          # Store the JAR filename in an environment variable
          EMBEDDABLE_JAR_FILE=$(ls fineract-progressive-loan-embeddable-schedule-generator/build/libs/*-all.jar | head -n 1)
          echo "EMBEDDABLE_JAR_FILE=$EMBEDDABLE_JAR_FILE" >> $GITHUB_ENV
          echo "JAR file: $EMBEDDABLE_JAR_FILE"

          # Run unit tests for the schedule generator
          ./gradlew --no-daemon --console=plain :fineract-progressive-loan-embeddable-schedule-generator:test

          # Build sample app
          ./gradlew --no-daemon --console=plain :fineract-progressive-loan-embeddable-schedule-generator:sample-app:classes

          # Run sample app (basic sanity)
          java -cp "$EMBEDDABLE_JAR_FILE:fineract-progressive-loan-embeddable-schedule-generator/sample-app/build/classes/java/main" Main 25

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
        with:
          name: test-results-progressive-loan
          path: |
            **/build/reports/
            **/fineract-progressive-loan-embeddable-schedule-generator/build/reports/
          retention-days: 5
          if-no-files-found: ignore

      - name: Archive Progressive Loan JAR
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
        with:
          name: progressive-loan-jar
          path: ${{ env.EMBEDDABLE_JAR_FILE }}
          retention-days: 5
          if-no-files-found: ignore
