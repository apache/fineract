# ============================================================================
# P2.1 — Unit + Integration Tests (JUnit)
# SoW 4.0 §4.3 | Proyecto 2 — Fineract Pruebas y Calidad (Dev)
#
# Disparador: PR contra main (GitHub Flow)
# Bloqueante: sí — status check requerido en branch protection
# Referencia SCARE: G.2 §6.1 (cobertura ≥90% funciones nuevas)
# ============================================================================
name: "P2.1 · Fineract Unit + Integration Tests"

on:
  pull_request:
    branches: [main]
    paths:
      - 'fineract-provider/**'
      - 'fineract-core/**'
      - 'fineract-loan/**'
      - 'fineract-savings/**'
      - 'fineract-investor/**'
      - 'build.gradle'
      - 'settings.gradle'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: p2-1-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.caching=true'

jobs:
  unit-and-integration-tests:
    name: "Unit + Integration Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fineract_tenants
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21 (Amazon Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Gradle — unit + integration tests
        run: |
          ./gradlew test integrationTest \
            --no-daemon \
            --continue \
            -PdbType=postgresql \
            -Pfineract.datasource.url=jdbc:postgresql://localhost:5432/fineract_tenants \
            -Pfineract.datasource.username=postgres \
            -Pfineract.datasource.password=postgres
        env:
          FINERACT_DEFAULT_TENANTDB_HOSTNAME: localhost
          FINERACT_DEFAULT_TENANTDB_PORT: 5432
          FINERACT_DEFAULT_TENANTDB_UID: postgres
          FINERACT_DEFAULT_TENANTDB_PWD: postgres

      - name: Publicar reporte de tests
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit Results
          path: '**/build/test-results/test/TEST-*.xml'
          reporter: java-junit
          fail-on-error: true

      # ------------------------------------------------------------------
      # Verificación de cobertura — G.2 §6.1: ≥90% funciones nuevas
      # JaCoCo se configura en build.gradle; aquí validamos el reporte.
      # ------------------------------------------------------------------
      - name: Verificar cobertura JaCoCo
        if: success()
        run: |
          echo "::group::Verificación de cobertura"
          # Verificar que el reporte JaCoCo existe
          REPORT=$(find . -path "*/build/reports/jacoco/test/jacocoTestReport.xml" | head -1)
          if [ -z "$REPORT" ]; then
            echo "::warning::Reporte JaCoCo no encontrado. Verificar configuración en build.gradle."
            echo "Para habilitar: agregar plugin 'jacoco' y configurar violationRules con minimum 0.90"
          else
            echo "Reporte JaCoCo encontrado en: $REPORT"
            # Extraer porcentaje de cobertura (line coverage)
            LINE_COVERED=$(grep -oP 'type="LINE".*?covered="\K[0-9]+' "$REPORT" | head -1 || echo "0")
            LINE_MISSED=$(grep -oP 'type="LINE".*?missed="\K[0-9]+' "$REPORT" | head -1 || echo "0")
            TOTAL=$((LINE_COVERED + LINE_MISSED))
            if [ "$TOTAL" -gt 0 ]; then
              COVERAGE=$((LINE_COVERED * 100 / TOTAL))
              echo "Cobertura de línea: ${COVERAGE}% (${LINE_COVERED}/${TOTAL})"
              if [ "$COVERAGE" -lt 90 ]; then
                echo "::warning::Cobertura ${COVERAGE}% < 90% (umbral G.2 §6.1)"
              fi
            fi
          fi
          echo "::endgroup::"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-p2-1
          path: |
            **/build/test-results/
            **/build/reports/jacoco/
          retention-days: 30
