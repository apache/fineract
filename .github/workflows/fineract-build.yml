# ============================================================================
# P3.1 — Build Fineract
# SoW 4.0 §4.4 | Proyecto 3 — Fineract Build y Despliegue (Dev+QA)
#
# Disparador: merge a main (solo tras P2.1, P2.3 y P2.4 en verde)
# Produce: imagen Docker firmada + tag en ECR + openapi-diff
#
# PoC: el push a ECR está condicionado a que exista el secret AWS.
#      Sin ECR, la imagen queda local como artifact.
# ============================================================================
name: "P3.1 · Fineract Build"

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write            # OIDC para Cosign keyless y AWS OIDC

concurrency:
  group: p3-1-build
  cancel-in-progress: false

env:
  JAVA_VERSION: '21'
  IMAGE_NAME: quida/fineract
  # Para producción: <account>.dkr.ecr.<region>.amazonaws.com/quida/fineract
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

jobs:
  build:
    name: "Build + Docker + Push"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_digest: ${{ steps.docker-push.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Generar tags semánticos ──
      - name: Docker meta (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=main-
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Setup JDK 21 (Amazon Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Gradle build (compile + package .jar)
        run: ./gradlew bootJar --no-daemon -x test

      # ── Extraer y publicar openapi.yaml (contrato de API) ──
      - name: Extraer OpenAPI spec
        run: |
          if [ -f fineract-provider/build/classes/java/main/static/fineract.yaml ]; then
            cp fineract-provider/build/classes/java/main/static/fineract.yaml openapi-current.yaml
          else
            echo "::warning::OpenAPI spec no encontrada en el build"
            echo "{}" > openapi-current.yaml
          fi

      # ── openapi-diff: detección de breaking changes ──
      - name: OpenAPI diff vs main previo
        continue-on-error: true
        run: |
          # Descargar spec de main anterior (si existe como artifact)
          echo "::group::OpenAPI diff"
          if [ -f openapi-current.yaml ] && [ -s openapi-current.yaml ]; then
            echo "OpenAPI spec generada ($(wc -l < openapi-current.yaml) líneas)"
            echo "En producción: comparar contra artifact del build anterior"
          fi
          echo "::endgroup::"

      - name: Docker build
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:main-${{ github.sha }} \
            -f fineract-provider/Dockerfile \
            .

      # ── Push a ECR (condicional — solo si hay credenciales AWS) ──
      - name: Configure AWS credentials
        if: env.ECR_REGISTRY != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        if: env.ECR_REGISTRY != ''
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push to ECR
        id: docker-push
        if: env.ECR_REGISTRY != ''
        run: |
          FULL_IMAGE="${ECR_REGISTRY}/quida/fineract:main-${GITHUB_SHA}"
          docker tag ${{ env.IMAGE_NAME }}:main-${{ github.sha }} "$FULL_IMAGE"
          docker push "$FULL_IMAGE"
          echo "digest=$(docker inspect --format='{{.Id}}' $FULL_IMAGE)" >> "$GITHUB_OUTPUT"
          echo "✅ Pushed: $FULL_IMAGE"

      # ── Cosign firma (S-05) ──
      - name: Instalar Cosign
        uses: sigstore/cosign-installer@v3

      - name: Firmar imagen (keyless PoC / KMS producción)
        run: |
          if [ -n "$ECR_REGISTRY" ]; then
            cosign sign --yes "${ECR_REGISTRY}/quida/fineract:main-${GITHUB_SHA}"
          else
            echo "::notice::Sin ECR configurado — firma Cosign omitida en PoC"
          fi
        env:
          COSIGN_EXPERIMENTAL: 1

      # ── S-BOM (S-06) ──
      - name: Generar S-BOM
        uses: anchore/sbom-action@v0
        with:
          image: '${{ env.IMAGE_NAME }}:main-${{ github.sha }}'
          format: spdx-json
          output-file: sbom-fineract.spdx.json

      # ── Artifacts ──
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-p3-1
          path: |
            openapi-current.yaml
            sbom-fineract.spdx.json
          retention-days: 90

  # ── Trigger P3.2 Deploy (workflow_call) ──
  trigger-deploy:
    name: "Trigger P3.2 Deploy"
    needs: build
    if: success()
    uses: ./.github/workflows/fineract-deploy.yml
    with:
      image_tag: main-${{ github.sha }}
      environment: dev
    secrets: inherit
