}

// Configurations every module's license report covers. Test dependencies are included
// deliberately: the report is expected to account for everything the build pulls in, not only what
// ends up on a runtime classpath.
ext.LICENSE_REPORT_CONFIGURATIONS = [
    'runtimeClasspath',
    'testRuntimeClasspath',
]

allprojects  {
    group = 'org.apache.fineract'

    repositories {
        mavenCentral()
    }

    configurations.configureEach {
        if (name == 'implementation') {
            exclude group: 'commons-logging', module: 'commons-logging'
        }
        resolutionStrategy {
            dependencySubstitution {
                // Substitution is to resolve CVE-2025-12183
                substitute module('org.lz4:lz4-java') using module('at.yawk.lz4:lz4-java:1.11.0')
            }
        }
    }

    apply plugin: 'com.adarshr.test-logger'
    apply plugin: 'com.diffplug.spotless'
    apply plugin: 'com.github.hierynomus.license'
    apply plugin: 'net.ltgt.errorprone'

    tasks.withType(JavaCompile).configureEach {
        options.errorprone {
            disableWarningsInGeneratedCode = true
            disable(
                    "CanIgnoreReturnValueSuggester",
                    "SameNameButDifferent", // Until errorprone recognizes Lombok
                    "MultiVariableDeclaration", // Until errorprone recognizes Lombok
                    "UnnecessaryDefaultInEnumSwitch", // FINERACT-1911
                    "StringConcatToTextBlock", // Error Prone 2.49.0 crashes on JDK 25, raised issue: https://github.com/google/error-prone/issues/5815
                    "AssertEqualsArgumentOrderChecker",
                    "RemoveUnusedImports"  // For generated code
            )
            error(
                    "DefaultCharset",
                    "StringSplitter",
                    "MutablePublicArray",
                    "EqualsGetClass",
                    "FutureReturnValueIgnored"
            )
        }
    }

    apply plugin: 'org.nosphere.apache.rat'
    apply plugin: 'com.github.jk1.dependency-license-report'

    // Configuration for the sonarqube plugin is now in GitHub Actions

    // Configuration for the spotless plugin
    // https://github.com/diffplug/spotless/tree/main/plugin-gradle
    spotless {
        format 'misc', {
            target '**/*.md', '**/*.properties', '**/.gitignore', '**/.openapi-generator-ignore', '**/*.yml', '**/*.xml', '**/**.json', '**/*.sql'
            targetExclude '**/build/**', '**/bin/**', '**/.settings/**', '**/.idea/**', '**/.gradle/**', '**/gradlew.bat', '**/licenses/**', '**/banner.txt', '.vscode/**', '.profileconfig.json', '**/*.md'
            indentWithSpaces(4)
            endWithNewline()
            trimTrailingWhitespace()
        }

        groovyGradle {
            target '*.gradle', '**/*.gradle'
            targetExclude '**/build/**', '/**/build.gradle','**/static-weaving.gradle' // TODO: temporary disabled on build.gradle until someone fix this issue: https://github.com/diffplug/spotless/issues/1807
            greclipse()
            indentWithSpaces(4)
            endWithNewline()
            trimTrailingWhitespace()
        }

        lineEndings = 'UNIX'
    }

    // Configuration for Gradle license plug-in
    // https://github.com/hierynomus/license-gradle-plugin
    license {
        header = rootProject.file("$rootDir/APACHE_LICENSETEXT.md")
        excludes([
            "**/gradlew*",
            "**/git.properties",
            "**/*.html",
            "**/templates/**",
            "**/features/**",
            "**/results/**",
            "**/package-info.java",
            "**/keystore.jks",
            "**/legacy-docs/**",
            "**/banner.txt",
            "**/build.gradle.mustache",
            "**/pom.mustache",
            "**/avro/**/*.java",
            "**/org/apache/fineract/client/**/*.java"
        ])
        strictCheck = true
    }

    licenseReport {
        // jk1 defaults 'projects' to this project *plus its subprojects*, and resolves every one of
        // them from this project's own task action. Gradle 9 refuses to resolve another project's
        // configuration from a task action while the build is parallel (org.gradle.parallel=true is
        // set in gradle.properties), so ':generateLicenseReport' and the ':custom*' container
        // reports fail outright. Each module reports only what it owns -- which is also the only
        // way to get the versions right, since dependency management is applied per project -- and
        // ':aggregateLicenseReport' merges them into $rootDir/licenses for the distribution.
        outputDir = project.layout.buildDirectory.dir('reports/dependency-license').get().asFile.path
        projects = [project]
        configurations = rootProject.ext.LICENSE_REPORT_CONFIGURATIONS
    }

    // Configuration for Apache Release Audit Tool task
    // https://github.com/eskatos/creadur-rat-gradle
    rat {
        verbose = false
        reportDir = project.layout.buildDirectory.dir('reports/rat')
        excludes = [
            '**/src/main/templates/**/*.mustache',
            '**/.dockerignore',
            '**/*.launch',
            '**/licenses/**',
            '**/*.md',
            '**/*.adoc',
            '**/*.puml',
            '**/*.github/**',
            '**/MANIFEST.MF',
            '**/spring.factories',
            '**/org.springframework.boot.autoconfigure.AutoConfiguration.imports',
            '**/*.json',
            '**/*.json.template',
            '**/*.txt',
            '**/*.log',
            '**/fineractdev-eclipse-preferences.epf',
            '**/features/**',
            '**/templates/**',
            '**/results/**',
            '**/.classpath',
            '**/.project',
            '**/.idea/**',
            '**/*.ipr',
            '**/*.iws',
            '**/.settings/**',
            '**/bin/**',
            '**/.git/**',
            '**/.gitignore',
            '**/.openapi-generator-ignore',
            '**/.gitkeep',
            '**/*.iml',
            '**/config/swagger/templates/**',
            // Notice files
            '**/NOTICE_RELEASE',
            '**/NOTICE_SOURCE',
            // gradle
            '**/.gradle/**',
            '**/gradlew',
            '**/gradlew.bat',
            '**/gradle/wrapper/gradle-wrapper.properties',
            '**/caches/**',
            '**/daemon/**',
