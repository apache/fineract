plugins {
    id 'java-gradle-plugin'
}

description = 'Fineract QueryDSL Gradle Plugin'

dependencies {
    compileOnly('io.github.openfeign.querydsl:querydsl-sql-codegen:7.7')
    compileOnly('io.github.openfeign.querydsl:querydsl-sql:7.7')
    compileOnly('org.liquibase:liquibase-core:4.33.0')
    compileOnly('org.testcontainers:postgresql:1.20.4')
}

gradlePlugin {
    plugins {
        register('querydslCodegen') {
            id = 'org.apache.fineract.querydsl.codegen'
            implementationClass = 'org.apache.fineract.querydsl.QuerydslCodegenPlugin'
        }
    }
}

testing {
    suites {
        test {
            useJUnitJupiter()
            dependencies {
                implementation(gradleApi())
                implementation('org.assertj:assertj-core:3.27.7')
            }
        }

        functionalTest(JvmTestSuite) {
            useJUnitJupiter()
            dependencies {
                implementation(project())
                implementation(gradleTestKit())
                implementation('org.assertj:assertj-core:3.27.7')
                implementation('org.testcontainers:testcontainers:1.20.4')
            }
            targets {
                all {
                    testTask.configure {
                        shouldRunAfter(tasks.named('test'))
                    }
                }
            }
        }
    }
}

gradlePlugin {
    testSourceSets(sourceSets.functionalTest)
}
