# Railway-specific configuration for Fineract

# Database connection settings using Railway environment variables
spring.datasource.hikari.driverClassName=org.postgresql.Driver
spring.datasource.hikari.jdbcUrl=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:fineract_tenants}
spring.datasource.hikari.username=${PGUSER:postgres}
spring.datasource.hikari.password=${PGPASSWORD:postgres}
spring.datasource.hikari.minimumIdle=3
spring.datasource.hikari.maximumPoolSize=20
spring.datasource.hikari.idleTimeout=60000
spring.datasource.hikari.connectionTimeout=30000
spring.datasource.hikari.connectionTestQuery=SELECT 1
spring.datasource.hikari.autoCommit=false
spring.datasource.hikari.transactionIsolation=TRANSACTION_READ_COMMITTED
spring.datasource.hikari.dataSourceProperties['cachePrepStmts']=true
spring.datasource.hikari.dataSourceProperties['prepStmtCacheSize']=250
spring.datasource.hikari.dataSourceProperties['prepStmtCacheSqlLimit']=2048
spring.datasource.hikari.dataSourceProperties['useServerPrepStmts']=true
spring.datasource.hikari.dataSourceProperties['reWriteBatchedInserts']=true
spring.datasource.hikari.dataSourceProperties['ApplicationName']=fineract-railway

# Tenant configuration using Railway PostgreSQL variables
fineract.tenant.host=${PGHOST:localhost}
fineract.tenant.port=${PGPORT:5432}
fineract.tenant.username=${PGUSER:postgres}
fineract.tenant.password=${PGPASSWORD:postgres}
fineract.tenant.parameters=
fineract.tenant.timezone=UTC
fineract.tenant.identifier=default
fineract.tenant.name=fineract_default
fineract.tenant.description=Default Railway Tenant

# Redis configuration using Railway Redis/Dragonfly variables
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=0
spring.data.redis.timeout=2000ms
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# Liquibase configuration - CRITICAL FIX
spring.liquibase.enabled=true
spring.liquibase.changeLog=classpath:/db/changelog/db.changelog-master.xml
spring.liquibase.contexts=tenant_store_db,tenant_db,initial_switch

# Operation modes
fineract.mode.read-enabled=true
fineract.mode.write-enabled=true
fineract.mode.batch-enabled=true
fineract.mode.batch-worker-enabled=true
fineract.mode.batch-manager-enabled=true

# Server configuration
server.port=8080
server.servlet.context-path=/fineract-provider
server.compression.enabled=true
server.ssl.enabled=false

# Health check
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus

# Security settings
fineract.security.basicauth.enabled=true
fineract.security.oauth.enabled=false
fineract.security.2fa.enabled=false
